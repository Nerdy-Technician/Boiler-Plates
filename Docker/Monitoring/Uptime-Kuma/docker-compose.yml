version: "3.9"

services:
  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_TAG:-latest}
    container_name: ${UPTIME_KUMA_NAME:-uptime-kuma}
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT_HOST:-3001}:3001"
    volumes:
      - "${UPTIME_KUMA_DATA_PATH:-./data}:/app/data"
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ${NETWORK_NAME:-uptime-kuma-net}

networks:
  ${NETWORK_NAME:-uptime-kuma-net}:
    driver: bridge
