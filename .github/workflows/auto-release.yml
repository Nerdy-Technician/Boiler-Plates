name: Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract Conventional Commits since last tag
        id: commits
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo '')
          echo "Last tag: ${LAST_TAG:-<none>}"
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:'%s' > commits.txt || true
          else
            git log "$LAST_TAG"..HEAD --pretty=format:'%s' > commits.txt || true
          fi
          # Ensure file exists even if no commits (edge case)
          touch commits.txt
          {
            printf 'commits<<COMMITS\n'
            cat commits.txt
            printf '\nCOMMITS\n'
          } >> "$GITHUB_OUTPUT"

      - name: Determine next version
        id: version
        env:
          COMMITS_COMMITS: ${{ steps.commits.outputs.commits }}
        run: |
          DEFAULT_START=0.1.0
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo '')
          if [ -z "$LAST_TAG" ]; then
            NEXT_VERSION=$DEFAULT_START
          else
            VERSION=${LAST_TAG#v}
            MAJOR=$(echo "$VERSION" | cut -d'.' -f1)
            MINOR=$(echo "$VERSION" | cut -d'.' -f2)
            PATCH=$(echo "$VERSION" | cut -d'.' -f3)
            COMMITS=$(echo "${COMMITS_COMMITS}")
            if echo "$COMMITS" | grep -E 'BREAKING CHANGE|^[a-z]+(\([^)]+\))?!:'; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif echo "$COMMITS" | grep -E '^feat'; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          NEXT_TAG="v$NEXT_VERSION"
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "next_tag=$NEXT_TAG" >> $GITHUB_OUTPUT
          echo "Next version: $NEXT_TAG"

      - name: Generate changelog snippet
        id: changelog
        env:
          VERSION_NEXT_VERSION: ${{ steps.version.outputs.next_version }}
          COMMITS_COMMITS: ${{ steps.commits.outputs.commits }}
        run: |
          echo "# Release ${VERSION_NEXT_VERSION}" > CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md
          echo "## Commits" >> CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md
          echo "${COMMITS_COMMITS}" | sed 's/^/- /' >> CHANGELOG_RELEASE.md
          echo "file=CHANGELOG_RELEASE.md" >> $GITHUB_OUTPUT

      - name: Create tag
        env:
          VERSION_NEXT_TAG: ${{ steps.version.outputs.next_tag }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${VERSION_NEXT_TAG}
          git push origin ${VERSION_NEXT_TAG}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.next_tag }}
          name: ${{ steps.version.outputs.next_tag }}
          body_path: CHANGELOG_RELEASE.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
